[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-lab"
version = "0.1.0"
description = "Train and evaluate a modern GPT-2-sized language model on a single GPU."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # RTX 50-series (Blackwell) needs PyTorch >= 2.7 built for CUDA 12.8.
    # Install torch first from the cu128 wheel index (see README).
    "torch>=2.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "tensorboard>=2.16",
    "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["datasets>=2.19"]
eval = ["transformers>=4.44", "lm-eval>=0.4.3"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gpt_lab.ui" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
